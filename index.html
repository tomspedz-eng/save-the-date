<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html { background: #0a0a0a; }

body {
  background: #0a0a0a;
  font-family: "Jost", sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 48px 0 60px;
  -webkit-font-smoothing: antialiased;
}

.hint {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-size: 13px;
  color: rgba(255,255,255,0.65);
  letter-spacing: 0.1em;
  text-align: center;
  margin-bottom: 20px;
  padding: 0 16px;
  animation: pulse 2.5s ease-in-out infinite;
  transition: opacity 0.6s ease;
}
.hint.hidden { opacity: 0; pointer-events: none; }
@keyframes pulse { 0%,100%{opacity:0.35} 50%{opacity:0.85} }

/* Cabinet */
.cabinet {
  width: min(260px, 82vw);
  background: linear-gradient(170deg, #1a1a1a 0%, #111 100%);
  border-radius: 14px 14px 0 0;
  border: 1.5px solid #272727;
  border-bottom: none;
  box-shadow: 0 0 0 1px #151515, 0 24px 64px rgba(0,0,0,0.9);
  overflow: visible;
  position: relative;
}

.cab-header {
  background: linear-gradient(90deg, #141414, #1e1e1e, #141414);
  border-bottom: 1px solid #272727;
  border-radius: 12px 12px 0 0;
  padding: 9px 12px;
  text-align: center;
}
.cab-header-text {
  font-family: "Cormorant Garamond", serif;
  font-size: 9px; letter-spacing: 0.32em;
  text-transform: uppercase; color: #C9A84C;
}

/* Strip — no gap, photos sit flush */
.strip {
  padding: 6px 6px 0;
  background: #0a0a0a;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* Photo — uses transform+opacity, no layout reflow */
.sp {
  position: relative;
  width: 100%;
  border-radius: 2px;
  overflow: hidden;
  /* Hidden: clipped to 0 height via scaleY */
  transform: scaleY(0);
  transform-origin: top center;
  opacity: 0;
  /* Will-change for GPU compositing */
  will-change: transform, opacity;
  transition:
    transform 0.55s cubic-bezier(0.22, 1, 0.36, 1),
    opacity 0.3s ease;
}
.sp.revealed {
  transform: scaleY(1);
  opacity: 1;
}
.sp img {
  width: 100%;
  display: block;
  border-radius: 2px;
  /* Prevent img from affecting layout before reveal */
  vertical-align: bottom;
}

/* Flash overlay */
.sp-flash {
  position: absolute; inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  border-radius: 2px;
  will-change: opacity;
}
.sp-flash.go { animation: fl 0.45s ease-out forwards; }
@keyframes fl { 0%{opacity:0.9} 100%{opacity:0} }

/* Word label */
.sp-label {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 10px 10px 8px;
  background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 100%);
  font-family: "Cormorant Garamond", serif;
  font-size: 24px; color: #fff; font-style: italic;
  text-align: center; letter-spacing: 0.04em;
  z-index: 2;
}
.sp-label.date {
  font-style: normal; font-weight: 600;
  letter-spacing: 0.2em; color: #E8C4C4;
  font-size: 18px;
}

/* Footer dots */
.cab-footer {
  padding: 7px 8px 8px;
  background: #111;
  border: 1.5px solid #272727;
  border-top: 1px solid #1e1e1e;
  display: flex; justify-content: center; gap: 5px;
}
.bdot {
  width: 5px; height: 5px; border-radius: 50%;
  background: #2a2a2a; transition: background 0.3s, transform 0.3s;
}
.bdot.active { background: #B07878; transform: scale(1.3); }

/* Invite card — separate from cabinet, slides in below */
.invite-wrap {
  width: min(260px, 82vw);
  overflow: hidden;
  /* Use height transition for smooth reveal */
  height: 0;
  transition: height 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  will-change: height;
}
.invite-wrap.visible { height: 140px; }

.invite {
  background: linear-gradient(160deg, #1E1818 0%, #141010 100%);
  border: 1.5px solid #B07878;
  border-top: none;
  padding: 18px 16px 20px;
  text-align: center;
}
.inv-names {
  font-family: "Cormorant Garamond", serif;
  font-size: 22px; color: #F5F0E8; line-height: 1;
  margin-bottom: 3px;
}
.inv-names span { font-style: italic; color: #D4A0A0; }
.inv-sub {
  font-size: 9px; letter-spacing: 0.2em;
  text-transform: uppercase; color: #9A7878;
  margin-bottom: 8px;
}
.inv-div { width: 20px; height: 1px; background: #B07878; margin: 7px auto; }
.inv-date {
  font-family: "Cormorant Garamond", serif;
  font-style: italic; font-size: 12px; color: #A09088;
  margin-bottom: 3px;
}
.inv-venue {
  font-size: 7.5px; letter-spacing: 0.1em;
  text-transform: uppercase; color: #6A6060;
}

/* Share */
.share-wrap {
  margin-top: 28px;
  opacity: 0; transform: translateY(6px);
  transition: opacity 0.5s ease, transform 0.5s ease;
  will-change: opacity, transform;
}
.share-wrap.visible { opacity: 1; transform: translateY(0); }
.share-btn {
  background: none; border: 1px solid rgba(255,255,255,0.18);
  color: rgba(255,255,255,0.55);
  padding: 11px 28px; border-radius: 4px;
  font-family: "Jost", sans-serif; font-size: 12px;
  font-weight: 500; letter-spacing: 0.1em; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: border-color 0.2s, color 0.2s;
}
.share-btn:active { opacity: 0.7; }
</style>

<script>
// Custom eased scroll — 60fps via rAF, no jank
function smoothScroll(targetY, ms) {
  var start = window.pageYOffset;
  var dist = targetY - start;
  if (Math.abs(dist) < 1) return;
  var t0 = null;
  function ease(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }
  function frame(ts) {
    if (!t0) t0 = ts;
    var p = Math.min((ts - t0) / ms, 1);
    window.scrollTo(0, start + dist * ease(p));
    if (p < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// Scroll so bottom of el sits 20px above viewport bottom
function anchorBottom(el, ms) {
  var rect = el.getBoundingClientRect();
  var target = window.pageYOffset + rect.bottom - window.innerHeight + 20;
  smoothScroll(Math.max(0, target), ms || 700);
}

// Photo sequence
var DELAYS = [900, 2100, 3300, 4500];

DELAYS.forEach(function(delay, i) {
  setTimeout(function() {
    try {
      // Reveal photo
      var sp = document.getElementById('sp' + i);
      var dot = document.getElementById('d' + i);
      var flash = document.getElementById('fl' + i);
      if (sp) sp.classList.add('revealed');
      if (flash) { flash.classList.add('go'); setTimeout(function(){ flash.classList.remove('go'); }, 450); }
      if (dot) dot.classList.add('active');
      // After transition completes (550ms), anchor to bottom of photo
      setTimeout(function() {
        var el = document.getElementById('sp' + i);
        if (el) anchorBottom(el, 650);
      }, 580);
    } catch(e) {}
  }, delay);
});

// Invite card
setTimeout(function() {
  try {
    var hint = document.getElementById('hint');
    if (hint) hint.classList.add('hidden');

    var wrap = document.getElementById('inviteWrap');
    if (wrap) {
      wrap.classList.add('visible');
      // After card opens (600ms transition), scroll to show it fully
      setTimeout(function() {
        anchorBottom(wrap, 700);
      }, 620);
    }

    // Share button fades in after card settles
    setTimeout(function() {
      var sw = document.getElementById('shareWrap');
      if (sw) {
        sw.classList.add('visible');
        setTimeout(function() { anchorBottom(sw, 600); }, 100);
      }
    }, 900);
  } catch(e) {}
}, 5800);

function doShare() {
  try {
    if (navigator.share) {
      navigator.share({
        title: 'Save the Date',
        text: 'Tom and Jennie are getting married! 25th September 2027, Sheffield.',
        url: window.location.href
      });
    } else {
      navigator.clipboard.writeText(window.location.href).then(function() {
        var b = document.getElementById('shareBtn');
        if (b) { b.textContent = 'Copied!'; setTimeout(function(){ b.textContent = 'Share →'; }, 2000); }
      });
    }
  } catch(e) {}
}
</script>
